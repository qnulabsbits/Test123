<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test123 - Qnulabs</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
            padding: 100px 20px;
            min-height: 100vh;
        }
        h1 {
            font-size: 4.5rem;
            margin: 30px 0 20px;
        }
        p {
            font-size: 1.5rem;
            max-width: 700px;
            margin: 0 auto 40px;
            opacity: 0.95;
        }
        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: white;
            color: #1e3c72;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            margin: 10px;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <h1>Hello, I'm Qnulabs</h1>
    <p>Welcome to my personal website hosted on GitHub Pages.</p>
    
    <a href="#" class="btn">About Me</a>
    <a href="#" class="btn">My Projects</a>
    <a href="#" class="btn">Get In Touch</a>
</body>
</html>

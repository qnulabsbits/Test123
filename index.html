<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qnulabs | Quantum Security</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            color: #333333;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle Quantum Background Elements */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 102, 0, 0.07) 0%, transparent 45%),
                radial-gradient(circle at 80% 25%, rgba(255, 102, 0, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 40% 80%, rgba(255, 102, 0, 0.06) 0%, transparent 45%),
                linear-gradient(rgba(255, 102, 0, 0.03) 1px, transparent 1px);
            background-size: 80px 80px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.85;
        }

        .navbar {
            display: flex;
            align-items: center;
            padding: 20px 5%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            width: 160px;
            height: auto;
        }

        .hero {
            padding-top: 160px;
            padding-bottom: 140px;
            text-align: center;
            max-width: 1000px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .hero h1 {
            font-size: 4.6rem;
            font-weight: 700;
            color: #ff6600;
            margin-bottom: 12px;
            text-shadow: 0 4px 15px rgba(255, 102, 0, 0.15);
        }

        .hero .subtitle {
            font-size: 1.85rem;
            color: #ff8533;
            font-weight: 500;
            margin-bottom: 35px;
        }

        .hero p {
            font-size: 1.35rem;
            max-width: 780px;
            margin: 0 auto 55px;
            line-height: 1.75;
            color: #444444;
        }

        .btn {
            display: inline-block;
            padding: 16px 42px;
            background: #ff6600;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.15rem;
            margin: 12px;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.25);
        }

        .btn:hover {
            transform: translateY(-5px);
            background: #ff8533;
            box-shadow: 0 10px 25px rgba(255, 102, 0, 0.35);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #ff6600;
            color: #ff6600;
        }

        .btn-secondary:hover {
            background: #ff6600;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar">
        <img src="logo.png" alt="QNu Labs Logo" class="logo">
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>QNu Labs</h1>
            <p class="subtitle">Perspective on <span style="color:#ff8533">Quantum Security</span></p>
            
            <p>
                Exploring the latest developments in Quantum Computing, 
                Post-Quantum Cryptography, and Cybersecurity in the Quantum Era.
            </p>
            
            <div>
                <a href="articles.html" class="btn">Latest Articles</a>
                <a href="https://www.qnulabs.com/about-us" class="btn btn-secondary" target="_blank">About QNu Labs</a>
                <a href="https://www.qnulabs.com/contact-us" class="btn btn-secondary" target="_blank">Get In Touch</a>
            </div>
        </div>
    </section>

</body>
</html>

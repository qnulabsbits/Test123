<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qnulabs | Quantum Security</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
       
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            color: #333;
            min-height: 100vh;
            padding: 0;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 40px;
            background: white;
            border-bottom: 1px solid #eee;
        }
        .logo {
            width: 160px;
            height: auto;
        }

        /* Main Content */
        .main-content {
            text-align: center;
            padding: 80px 20px 100px;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 4.2rem;
            margin: 30px 0 15px;
            font-weight: 700;
            color: #ff6600;
        }
        .subtitle {
            font-size: 1.65rem;
            margin-bottom: 40px;
            font-weight: 500;
            color: #ff8533;
        }
        p {
            font-size: 1.35rem;
            max-width: 780px;
            margin: 0 auto 50px;
            line-height: 1.65;
            color: #444;
        }
        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: #ff6600;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            margin: 12px;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-5px);
            background: #ff8533;
        }
    </style>
</head>
<body>
    <!-- Header with Logo on Left -->
    <div class="header">
        <img src="logo.png" alt="Qnulabs Logo" class="logo">
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Qnulabs</h1>
        <p class="subtitle">Perspective on <span style="color:#ff8533">Quantum Security</span></p>
       
        <p>
            Exploring the latest developments in Quantum Computing, 
            Post-Quantum Cryptography, and Cybersecurity in the Quantum Era.
        </p>
      
        <a href="articles.html" class="btn">Latest Articles</a>
        <a href="https://www.qnulabs.com/about-us" class="btn" target="_blank">About Qnulabs</a>
        <a href="https://www.qnulabs.com/contact-us" class="btn" target="_blank">Get In Touch</a>
    </div>
</body>
</html>

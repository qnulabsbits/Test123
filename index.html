<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qnulabs | Quantum Security</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Subtle Quantum Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 102, 0, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 102, 0, 0.06) 0%, transparent 50%);
            background-size: 120px 120px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.7;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 102, 0, 0.2);
        }

        .logo {
            width: 160px;
            height: auto;
        }

        .hero {
            padding-top: 180px;
            padding-bottom: 100px;
            text-align: center;
            max-width: 1100px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        .hero h1 {
            font-size: 4.2rem;
            font-weight: 700;
            color: #ff6600;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 102, 0, 0.4);
        }

        .hero .subtitle {
            font-size: 1.8rem;
            color: #ff8533;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .hero p {
            font-size: 1.35rem;
            max-width: 800px;
            margin: 0 auto 50px;
            line-height: 1.7;
            color: #cbd5e1;
        }

        .btn {
            display: inline-block;
            padding: 16px 42px;
            background: #ff6600;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.15rem;
            margin: 12px;
            transition: all 0.4s;
            box-shadow: 0 8px 25px rgba(255, 102, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-6px);
            background: #ff8533;
            box-shadow: 0 12px 30px rgba(255, 102, 0, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #ff6600;
            color: #ff6600;
        }

        .btn-secondary:hover {
            background: #ff6600;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar">
        <img src="logo.png" alt="QNu Labs Logo" class="logo">
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>QNu Labs</h1>
        <p class="subtitle">Perspective on <span style="color:#ff8533">Quantum Security</span></p>
        
        <p>
            Exploring the latest developments in Quantum Computing, 
            Post-Quantum Cryptography, and Cybersecurity in the Quantum Era.
        </p>
        
        <div>
            <a href="articles.html" class="btn">Latest Articles</a>
            <a href="https://www.qnulabs.com/about-us" class="btn btn-secondary" target="_blank">About QNu Labs</a>
            <a href="https://www.qnulabs.com/contact-us" class="btn btn-secondary" target="_blank">Get In Touch</a>
        </div>
    </section>

</body>
</html>
